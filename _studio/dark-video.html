<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=EB+Garamond:ital@1&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#080706;overflow:hidden}canvas{display:block}</style>
</head><body><canvas id="c" width="1280" height="720"></canvas>
<script>
// THE DARK POOL — 10s deterministic hype: a live tape, a position that goes dark, P&L that only you can see.
const W = 1280, H = 720, cv = document.getElementById('c'), g = cv.getContext('2d');
const GOLD = '#c9a25e', GOLD2 = '#e9cf95', INK = '#e9ddc6', VERD = '#62a187', VERD2 = '#8fd1b4', RED = '#d8503a', MUT = '#8f8470';
function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
const R = rng(53);
const MOTES = Array.from({ length: 140 }, () => ({ x: R(), y: R(), sp: 0.02 + R() * 0.05, sz: 1 + R() * 2.2, ph: R() * 6.28, hot: R() }));
const TICKS = [['HOOD', 113.33], ['TSLA', 348.10], ['NVDA', 176.42], ['SPY', 648.90], ['COIN', 322.05], ['MSTR', 341.77], ['AAPL', 229.61], ['GLD', 334.12], ['BTC', 111842], ['ETH', 4312.6]];
const PATH = Array.from({ length: 120 }, (_, i) => { let v = 0; return i; }); let seed = 0; const curve = []; { let v = 0; const r = rng(9); for (let i = 0; i < 120; i++) { v += (r() - .47) * 1.6; curve.push(v); } }
const ease = (k) => k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const fadeIO = (t, a, b, f = .35) => Math.min(seg(t, a, a + f), 1 - seg(t, b - f, b));
function bg(t) { g.fillStyle = '#080706'; g.fillRect(0, 0, W, H); const gl = g.createRadialGradient(W / 2, H / 2, 40, W / 2, H / 2, 760); gl.addColorStop(0, 'rgba(201,162,94,.10)'); gl.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gl; g.fillRect(0, 0, W, H); }
function motes(t, a) { for (const e of MOTES) { const y = ((e.y - t * e.sp) % 1 + 1) % 1; g.fillStyle = e.hot > .5 ? `rgba(143,209,180,${a * .6})` : `rgba(233,207,149,${a * .6})`; g.beginPath(); g.arc((e.x + Math.sin(t + e.ph) * .01) * W, y * H, e.sz, 0, 6.28); g.fill(); } }
function txt(s, x, y, size, color, font = 'Cinzel', weight = 800, align = 'center', ls = 0) { g.font = `${weight} ${size}px '${font}'`; g.fillStyle = color; g.textAlign = align; g.textBaseline = 'middle'; g.letterSpacing = ls + 'px'; g.fillText(s, x, y); g.letterSpacing = '0px'; }
function vignette() { const v = g.createRadialGradient(W / 2, H / 2, 300, W / 2, H / 2, 820); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.6)'); g.fillStyle = v; g.fillRect(0, 0, W, H); }
function redact(x, y, w, h, a) { g.fillStyle = `rgba(13,10,6,${a})`; g.fillRect(x, y, w, h); g.strokeStyle = `rgba(201,162,94,${a * .6})`; g.lineWidth = 1.5; g.strokeRect(x + .5, y + .5, w - 1, h - 1); }
function tapeStrip(t, y, a) { g.save(); g.globalAlpha = a; const off = (t * 90) % 1600; g.font = "500 20px 'JetBrains Mono'"; g.textBaseline = 'middle';
  for (let i = -1; i < 3; i++) TICKS.forEach((tk, j) => { const x = i * 1600 + j * 160 - off + 40; if (x < -200 || x > W + 200) return; g.fillStyle = GOLD; g.textAlign = 'left'; g.fillText(tk[0], x, y); g.fillStyle = INK; g.fillText('$' + tk[1].toLocaleString('en-US', { maximumFractionDigits: 2 }), x + 66, y); });
  g.restore(); }
function chart(t, x, y, w, h, a, k) { g.save(); g.globalAlpha = a; g.strokeStyle = 'rgba(201,162,94,.25)'; g.lineWidth = 1; g.strokeRect(x, y, w, h);
  const n = Math.max(2, Math.floor(curve.length * k)); g.beginPath(); for (let i = 0; i < n; i++) { const px = x + w * i / (curve.length - 1), py = y + h / 2 - curve[i] * 8; i ? g.lineTo(px, py) : g.moveTo(px, py); }
  g.strokeStyle = VERD2; g.lineWidth = 3; g.shadowColor = 'rgba(143,209,180,.6)'; g.shadowBlur = 14; g.stroke(); g.restore(); return { x: x + w * (n - 1) / (curve.length - 1), y: y + h / 2 - curve[n - 1] * 8, v: curve[n - 1] }; }

window.__seek = function (t) {
  bg(t); motes(t, t < 9 ? .8 : .8 * (1 - seg(t, 9, 10))); vignette();
  // 0–2.3 hook: the tape
  if (t < 2.4) { const a = fadeIO(t, .2, 2.4, .35); tapeStrip(t, 120, a * .9); g.globalAlpha = a; txt('EVERY STOCK ON ROBINHOOD CHAIN', W / 2, H / 2 - 30, 56, INK, 'Cinzel', 800, 'center', 5); txt('is traded in public. every position. every size. every wallet.', W / 2, H / 2 + 44, 28, MUT, 'EB Garamond', 400); g.globalAlpha = 1; }
  // 2.3–6.6 the dark pool: open a position, it goes dark
  if (t >= 2.3 && t < 6.7) {
    const a = fadeIO(t, 2.3, 6.7, .3); const k = seg(t, 2.6, 6.2);
    g.globalAlpha = a; txt('THE DARK POOL', W / 2, 100, 64, GOLD2, 'Cinzel', 800, 'center', 12); txt('shielded sUSD → a long or short on tokenized stocks, priced off the live tape', W / 2, 160, 24, MUT, 'EB Garamond', 400); g.globalAlpha = 1;
    const end = chart(t, 140, 220, 620, 300, a, k);
    g.globalAlpha = a; txt('HOOD · LONG · 1x', 150, 545, 16, VERD, 'JetBrains Mono', 500, 'left', 4); g.globalAlpha = 1;
    // you see
    const pnl = end.v * 12.4;
    g.globalAlpha = a; txt('YOU SEE', 1010, 235, 16, VERD2, 'JetBrains Mono', 500, 'center', 5);
    txt('HOOD', 1010, 290, 44, INK, 'Cinzel', 800, 'center', 4); txt('long · 1,000 sUSD', 1010, 335, 20, MUT, 'JetBrains Mono', 500, 'center', 1);
    txt((pnl >= 0 ? '+' : '') + pnl.toFixed(2) + ' sUSD', 1010, 390, 40, pnl >= 0 ? VERD2 : RED, 'Cinzel', 800, 'center', 1); g.globalAlpha = 1;
    // everyone sees
    const kk = seg(t, 3.4, 4.0);
    g.globalAlpha = a * kk; txt('EVERYONE SEES', 1010, 470, 16, RED, 'JetBrains Mono', 500, 'center', 5); g.globalAlpha = 1;
    redact(900, 500, 220, 34, a * kk); redact(920, 546, 180, 26, a * kk); redact(940, 584, 140, 26, a * kk);
    g.globalAlpha = a * kk; txt('ticker · size · side · p&l', 1010, 640, 16, MUT, 'JetBrains Mono', 500, 'center', 3); g.globalAlpha = 1;
  }
  // 6.6–8.5 punch
  if (t >= 6.6 && t < 8.6) { const a = fadeIO(t, 6.6, 8.6, .3); g.globalAlpha = a; txt('THE FIRST PRIVATE STOCK DESK', W / 2, H / 2 - 60, 54, INK, 'Cinzel', 800, 'center', 4); g.globalAlpha = a * seg(t, 7.0, 7.4); g.shadowColor = 'rgba(201,162,94,.6)'; g.shadowBlur = 30; txt('ON ROBINHOOD CHAIN.', W / 2, H / 2 + 30, 60, GOLD2, 'Cinzel', 800, 'center', 4); g.shadowBlur = 0; g.globalAlpha = a; txt('HOOD · TSLA · NVDA · SPY · COIN · MSTR · AAPL · GLD · BTC · ETH  ·  30 bps to the pyre', W / 2, H / 2 + 115, 20, MUT, 'JetBrains Mono', 500, 'center', 2); g.globalAlpha = 1; }
  // 8.5–10 outro
  if (t >= 8.5) { const a = seg(t, 8.5, 8.9); g.globalAlpha = a; txt('STYX', W / 2, H / 2 - 20, 96, GOLD, 'Cinzel', 800, 'center', 22); txt('styxrh.xyz/?tab=dark  ·  $STYX', W / 2, H / 2 + 70, 26, GOLD2, 'JetBrains Mono', 500, 'center', 2); g.globalAlpha = 1; }
  return true;
};
window.__ready = document.fonts.ready.then(() => { __seek(0); return true; });
</script></body></html>
